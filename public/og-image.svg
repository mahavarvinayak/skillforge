<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Paper background pattern -->
    <pattern id="dotgrid" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="12" cy="12" r="1.1" fill="#d9cdbc" />
    </pattern>
    <!-- Radial warmth -->
    <radialGradient id="warmth" cx="70%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#c8102e" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#f7f2ea" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="#f7f2ea" />
  <rect width="1200" height="630" fill="url(#dotgrid)" />
  <rect width="1200" height="630" fill="url(#warmth)" />

  <!-- Outer frame border -->
  <rect x="28" y="28" width="1144" height="574" rx="16" fill="none" stroke="#d9cdbc" stroke-width="2" />
  <rect x="36" y="36" width="1128" height="558" rx="10" fill="none" stroke="#c8102e" stroke-width="1.5" stroke-opacity="0.35" />

  <!-- π Watermark Background Mark -->
  <text x="1000" y="440" font-family="Georgia, serif" font-size="420" font-weight="900" font-style="italic" fill="none" stroke="#c8102e" stroke-width="3" stroke-opacity="0.10" text-anchor="middle">π</text>

  <!-- Header Section -->
  <g transform="translate(80, 85)">
    <!-- Pi Icon -->
    <rect x="0" y="0" width="46" height="46" rx="12" fill="#c8102e" />
    <text x="23" y="32" font-family="Georgia, serif" font-size="28" font-weight="700" fill="#ffffff" text-anchor="middle">π</text>
    
    <text x="62" y="24" font-family="'Courier New', monospace" font-size="14" font-weight="700" letter-spacing="3" fill="#c8102e">THE PI LAB</text>
    <text x="62" y="42" font-family="'Courier New', monospace" font-size="11" font-weight="600" letter-spacing="2" fill="#7a6f61">OPEN SOURCE · MIT LICENSE · PRODUCTION READY</text>
  </g>

  <!-- Main Title -->
  <g transform="translate(80, 240)">
    <text font-family="Georgia, 'Times New Roman', serif" font-size="82" font-weight="900" letter-spacing="-1">
      <tspan fill="#191410">SKILL</tspan><tspan fill="#c8102e" font-style="italic">FORGE</tspan>
    </text>
    
    <text y="64" font-family="system-ui, -apple-system, sans-serif" font-size="27" font-weight="600" fill="#191410">
      The Modular Intelligence &amp; Reasoning Layer for LinkedIn Workflows
    </text>
    <text y="104" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="400" fill="#7a6f61">
      40 contract-governed skills decoupling what an agent thinks from how it executes.
    </text>
  </g>

  <!-- Badges / Pill Tags -->
  <g transform="translate(80, 410)">
    <!-- Badge 1 -->
    <rect x="0" y="0" width="138" height="40" rx="20" fill="#191410" />
    <text x="69" y="25" font-family="'Courier New', monospace" font-size="12" font-weight="700" fill="#f7f2ea" text-anchor="middle" letter-spacing="1.5">40 SKILLS</text>

    <!-- Badge 2 -->
    <rect x="150" y="0" width="150" height="40" rx="20" fill="#191410" />
    <text x="225" y="25" font-family="'Courier New', monospace" font-size="12" font-weight="700" fill="#f7f2ea" text-anchor="middle" letter-spacing="1.5">10 DOMAINS</text>

    <!-- Badge 3 -->
    <rect x="312" y="0" width="180" height="40" rx="20" fill="#c8102e" />
    <text x="402" y="25" font-family="'Courier New', monospace" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle" letter-spacing="1.5">ZERO RUNTIME DEPS</text>

    <!-- Badge 4 -->
    <rect x="504" y="0" width="190" height="40" rx="20" fill="#191410" />
    <text x="599" y="25" font-family="'Courier New', monospace" font-size="12" font-weight="700" fill="#f7f2ea" text-anchor="middle" letter-spacing="1.5">DRAFT 2020-12 SCHEMA</text>

    <!-- Badge 5 -->
    <rect x="706" y="0" width="168" height="40" rx="20" fill="#efe8dd" stroke="#d9cdbc" stroke-width="1" />
    <text x="790" y="25" font-family="'Courier New', monospace" font-size="12" font-weight="700" fill="#191410" text-anchor="middle" letter-spacing="1.5">10+ IDE HOSTS</text>
  </g>

  <!-- Footer Info Line -->
  <g transform="translate(80, 535)">
    <line x1="0" y1="0" x2="1040" y2="0" stroke="#d9cdbc" stroke-width="1" />
    <text x="0" y="26" font-family="'Courier New', monospace" font-size="12" font-weight="600" fill="#7a6f61" letter-spacing="1">
      CLAUDE CODE · CURSOR · WINDSURF · VS CODE · ZED · JETBRAINS · NEOVIM · GENERIC AGENTS
    </text>
    <text x="1040" y="26" font-family="'Courier New', monospace" font-size="12" font-weight="700" fill="#c8102e" text-anchor="end" letter-spacing="1">
      thepilab.in/linkedin-skillforge
    </text>
  </g>
</svg>
